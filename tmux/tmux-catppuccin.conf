# Sourced at startup and from the client-{dark,light}-theme hooks.
# The caller sets @catppuccin_flavor first.
#
# The plugin sets its options with -o (never overwrite) and several with -F
# (expand now, store the result), which freezes colors to whichever flavor
# loaded first. Unsetting everything it owns lets one run rebuild them all.
run "tmux show-options -g \
  | grep -oE '^@(catppuccin|thm)[a-zA-Z0-9_]*' \
  | grep -vx '@catppuccin_flavor' \
  | sed 's/^/set-option -gu /; s/$/ ;/' \
  | xargs -r tmux"

set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
run ~/.local/share/tmux/plugins/catppuccin/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_host}'
